version: '3.9'

services:
  # NestJS API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_api
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - backend_net
    
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres_database
    restart: always
    env_file:
      - .env 
    environment:
      POSTGRES_DB: ${TYPEORM_DATABASE}
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${TYPEORM_PORT}:5432"
    networks:
      - backend_net
  
  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    env_file:
      - .env
    ports:
      - "6379:6379"
    networks:
      - backend_net
  
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - backend_net

# Volumes
volumes:
  pg_data:

# Network
networks:
  backend_net:
    driver: bridge
